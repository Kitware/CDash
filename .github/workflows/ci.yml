name: CI

on:
  push:
    branches:
      - master
      - "releases/*"
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  tests:
    env:
      SITENAME: GitHub Actions
      BASE_IMAGE: ${{matrix.base-image}}
      STORAGE_TYPE: ${{matrix.storage}}
      POSTGRES_VERSION: ${{matrix.postgres-version}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-image: ['debian', 'ubi']
        storage: ['local', 'minio']
        postgres-version: ['18']
        exclude:
          - storage: minio
            base-image: ubi
        include:
          # Also test against the minimum supported postgres version, on a single
          # configuration (local storage, debian) to avoid matrix blowup.
          - base-image: debian
            storage: local
            postgres-version: '14'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        shell: bash
        run: |
          if [ "${{matrix.storage}}" == "minio" ]; then
            extra_args="-f docker/docker-compose.minio.yml"
          fi
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.dev.yml \
              -f docker/docker-compose.postgres.yml ${extra_args} \
              --env-file .env.dev up -d \
              --build \
              --wait

      - name: Run Tests
        env:
          # Lets CDash link the build back to the pull request.  Empty for non-PR events.
          CHANGE_ID: ${{github.event.pull_request.number}}
        run: |
          if [ "${{github.event_name}}" == "pull_request" ]; then
            BUILD_GROUP="Pull Requests";
          elif [ "${{github.event_name}}" == "merge_group" ]; then
            BUILD_GROUP="Merge Queue";
          elif [[ "${GITHUB_REF}" =~ "/master" ]] ; then
            BUILD_GROUP="Master";
          elif [[ "${GITHUB_REF}" =~ "releases/" ]] ; then
            BUILD_GROUP="Release";
          else
            BUILD_GROUP="Experimental";
          fi
          echo "Submitting to build group: ${BUILD_GROUP}"
          bash .github/workflows/submit.sh "${BUILD_GROUP}"

  build-images:
    runs-on: ${{matrix.architecture}}
    strategy:
      fail-fast: false
      matrix:
        architecture: [ 'ubuntu-24.04', 'ubuntu-24.04-arm' ]
        base-image: [ 'debian', 'ubi' ]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        name: Build ${{matrix.base-image}} production image
        with:
          context: .
          push: false
          target: cdash
          build-args: |
            BASE_IMAGE=${{matrix.base-image}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
